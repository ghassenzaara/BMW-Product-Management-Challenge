openapi: 3.1.0
info:
  title: Argon API
  version: 0.1.0
  description: "Contract between the UI and the backend. Source of truth: web/src/contracts (Zod). Regenerate with `npm run export-contract` in web/. Reference implementation (mock): web/src/mock."
servers:
  - url: /api
    description: Mock backend (Next.js route handlers)
security:
  - userHeader: []
paths:
  /me:
    get:
      operationId: me
      summary: Current user, workspace and active weight profile
      tags:
        - identity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  workspace:
                    $ref: "#/components/schemas/Workspace"
                  weightProfile:
                    $ref: "#/components/schemas/WeightProfile"
                  brief:
                    anyOf:
                      - $ref: "#/components/schemas/ResolvedBrief"
                      - type: "null"
                  needsOnboarding:
                    type: boolean
                  features:
                    type: object
                    properties:
                      agentRefresh:
                        type: boolean
                      competitorRipple:
                        type: boolean
                    required:
                      - agentRefresh
                      - competitorRipple
                    additionalProperties: false
                required:
                  - user
                  - workspace
                  - weightProfile
                  - brief
                  - needsOnboarding
                  - features
                additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /users:
    get:
      operationId: users
      summary: All users
      tags:
        - identity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /workspace:
    put:
      operationId: updateWorkspace
      summary: Update my workspace (weights, filters, watchlist, project type)
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                series:
                  type: string
                  enum:
                    - G60
                    - F70
                    - G70
                region:
                  type: string
                  enum:
                    - global
                    - RoW
                    - CN
                projectType:
                  type: string
                  enum:
                    - new_gen
                    - lci
                weightProfileId:
                  type: string
                  minLength: 1
                sourceFilter:
                  $ref: "#/components/schemas/SourceFilter"
                watchlist:
                  $ref: "#/components/schemas/Watchlist"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /search:
    get:
      operationId: search
      summary: Global search
      tags:
        - identity
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - case
                        - requirement
                        - signal
                        - user
                    id:
                      type: string
                    title:
                      type: string
                    subtitle:
                      type: string
                    href:
                      type: string
                  required:
                    - type
                    - id
                    - title
                    - subtitle
                    - href
                  additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /briefs:
    get:
      operationId: briefs
      summary: Shared briefs and regional overlays
      tags:
        - briefs
      parameters:
        - name: series
          in: query
          required: false
          schema:
            type: string
            enum:
              - G60
              - F70
              - G70
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeriesBrief"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
    post:
      operationId: createOverlay
      summary: Create my regional overlay on the shared brief of my series
      tags:
        - briefs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                series:
                  type: string
                  enum:
                    - G60
                    - F70
                    - G70
              required:
                - series
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesBrief"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /briefs/mine:
    get:
      operationId: myBrief
      summary: My resolved brief with its shared brief, overlay and pending proposals
      tags:
        - briefs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved:
                    anyOf:
                      - $ref: "#/components/schemas/ResolvedBrief"
                      - type: "null"
                  shared:
                    anyOf:
                      - $ref: "#/components/schemas/SeriesBrief"
                      - type: "null"
                  overlay:
                    anyOf:
                      - $ref: "#/components/schemas/SeriesBrief"
                      - type: "null"
                  proposals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proposal"
                required:
                  - resolved
                  - shared
                  - overlay
                  - proposals
                additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /briefs/{id}:
    put:
      operationId: saveBrief
      summary: Save brief answers (reasons per changed field); returns the requirements it affects as new-version proposals
      tags:
        - briefs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  properties:
                    thesis:
                      type: string
                    targetCustomer:
                      type: object
                      properties:
                        who:
                          type: string
                          enum:
                            - keep_owners
                            - conquest
                            - both
                        positioning:
                          type: string
                          enum:
                            - base
                            - premium
                            - luxury
                      required:
                        - who
                        - positioning
                    marketWeights:
                      $ref: "#/components/schemas/MarketWeights"
                    changeAmbition:
                      type: object
                      properties:
                        level:
                          type: string
                          enum:
                            - evolution
                            - balanced
                            - revolution
                        innovationSlots:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                        - level
                        - innovationSlots
                    protectList:
                      type: array
                      items:
                        type: string
                    dontFightOn:
                      type: array
                      items:
                        type: string
                    givens:
                      type: object
                      properties:
                        platform:
                          type: string
                        sop:
                          type: string
                        frozen:
                          type: array
                          items:
                            type: string
                        openReleases:
                          type: array
                          items:
                            type: string
                            enum:
                              - next_gen
                              - lci
                              - ota
                        cycle:
                          type: string
                          enum:
                            - WLTP
                            - EPA
                            - CLTC
                      required:
                        - platform
                        - sop
                        - frozen
                        - openReleases
                        - cycle
                    costEnvelope:
                      type: object
                      properties:
                        sensitivity:
                          type: string
                          enum:
                            - low
                            - medium
                            - high
                        perCarBand:
                          type: string
                      required:
                        - sensitivity
                        - perCarBand
                reasons:
                  type: object
                  propertyNames:
                    type: string
                    enum:
                      - thesis
                      - targetCustomer
                      - marketWeights
                      - changeAmbition
                      - protectList
                      - dontFightOn
                      - givens
                      - costEnvelope
                  additionalProperties:
                    type: string
                confirm:
                  type: array
                  items:
                    type: string
                    enum:
                      - thesis
                      - targetCustomer
                      - marketWeights
                      - changeAmbition
                      - protectList
                      - dontFightOn
                      - givens
                      - costEnvelope
                clear:
                  type: array
                  items:
                    type: string
                    enum:
                      - thesis
                      - targetCustomer
                      - marketWeights
                      - changeAmbition
                      - protectList
                      - dontFightOn
                      - givens
                      - costEnvelope
              required:
                - values
                - reasons
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  brief:
                    $ref: "#/components/schemas/SeriesBrief"
                  impact:
                    type: array
                    items:
                      type: object
                      properties:
                        requirementId:
                          type: string
                        title:
                          type: string
                        fields:
                          type: array
                          items:
                            type: string
                            enum:
                              - thesis
                              - targetCustomer
                              - marketWeights
                              - changeAmbition
                              - protectList
                              - dontFightOn
                              - givens
                              - costEnvelope
                        summary:
                          type: string
                        changes:
                          type: array
                          items:
                            $ref: "#/components/schemas/FieldChange"
                        proposalId:
                          type:
                            - string
                            - "null"
                      required:
                        - requirementId
                        - title
                        - fields
                        - summary
                        - changes
                        - proposalId
                      additionalProperties: false
                required:
                  - brief
                  - impact
                additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /briefs/{id}/impact:
    post:
      operationId: previewBriefImpact
      summary: What would change in which requirements if these brief values were saved (nothing is stored)
      tags:
        - briefs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  properties:
                    thesis:
                      type: string
                    targetCustomer:
                      type: object
                      properties:
                        who:
                          type: string
                          enum:
                            - keep_owners
                            - conquest
                            - both
                        positioning:
                          type: string
                          enum:
                            - base
                            - premium
                            - luxury
                      required:
                        - who
                        - positioning
                    marketWeights:
                      $ref: "#/components/schemas/MarketWeights"
                    changeAmbition:
                      type: object
                      properties:
                        level:
                          type: string
                          enum:
                            - evolution
                            - balanced
                            - revolution
                        innovationSlots:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                        - level
                        - innovationSlots
                    protectList:
                      type: array
                      items:
                        type: string
                    dontFightOn:
                      type: array
                      items:
                        type: string
                    givens:
                      type: object
                      properties:
                        platform:
                          type: string
                        sop:
                          type: string
                        frozen:
                          type: array
                          items:
                            type: string
                        openReleases:
                          type: array
                          items:
                            type: string
                            enum:
                              - next_gen
                              - lci
                              - ota
                        cycle:
                          type: string
                          enum:
                            - WLTP
                            - EPA
                            - CLTC
                      required:
                        - platform
                        - sop
                        - frozen
                        - openReleases
                        - cycle
                    costEnvelope:
                      type: object
                      properties:
                        sensitivity:
                          type: string
                          enum:
                            - low
                            - medium
                            - high
                        perCarBand:
                          type: string
                      required:
                        - sensitivity
                        - perCarBand
              required:
                - values
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    requirementId:
                      type: string
                    title:
                      type: string
                    fields:
                      type: array
                      items:
                        type: string
                        enum:
                          - thesis
                          - targetCustomer
                          - marketWeights
                          - changeAmbition
                          - protectList
                          - dontFightOn
                          - givens
                          - costEnvelope
                    summary:
                      type: string
                    changes:
                      type: array
                      items:
                        $ref: "#/components/schemas/FieldChange"
                    proposalId:
                      type:
                        - string
                        - "null"
                  required:
                    - requirementId
                    - title
                    - fields
                    - summary
                    - changes
                    - proposalId
                  additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /briefs/{id}/extract:
    post:
      operationId: extractBrief
      summary: Paste a strategy doc; the AI proposes brief field values to accept or reject one by one
      tags:
        - briefs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 20
              required:
                - text
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /brief-conflicts:
    get:
      operationId: briefConflicts
      summary: Overlay fields that differ from the shared brief (open ones first)
      tags:
        - briefs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      enum:
                        - thesis
                        - targetCustomer
                        - marketWeights
                        - changeAmbition
                        - protectList
                        - dontFightOn
                        - givens
                        - costEnvelope
                    overlayId:
                      type: string
                      minLength: 1
                    sharedValue: {}
                    overlayValue: {}
                    reason:
                      type: string
                    status:
                      type: string
                      enum:
                        - open
                        - regional_variant
                    series:
                      type: string
                      enum:
                        - G60
                        - F70
                        - G70
                    ownerId:
                      type: string
                  required:
                    - field
                    - overlayId
                    - sharedValue
                    - overlayValue
                    - reason
                    - status
                    - series
                    - ownerId
                  additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /briefs/{id}/conflicts/{field}:
    post:
      operationId: resolveBriefConflict
      summary: "Head of product line: accept the difference as a regional variant, or align the overlay to the shared brief"
      tags:
        - briefs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: field
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution:
                  type: string
                  enum:
                    - regional_variant
                    - align
                rationale:
                  type: string
                  minLength: 1
              required:
                - resolution
                - rationale
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesBrief"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /signals:
    get:
      operationId: signals
      summary: List signals (findings)
      tags:
        - signals
      parameters:
        - name: series
          in: query
          required: false
          schema:
            type: string
            enum:
              - G60
              - F70
              - G70
        - name: caseId
          in: query
          required: false
          schema:
            type: string
        - name: agent
          in: query
          required: false
          schema:
            type: string
            enum:
              - bmw_data
              - competitor
              - customer_public
              - trends
              - innovation_scout
              - pm
        - name: market
          in: query
          required: false
          schema:
            type: string
            enum:
              - EU
              - US
              - CN
              - RoW
              - unknown
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - complaint
              - wish
              - like
              - competitor_fact
              - trend
              - innovation
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - new
              - clustered
              - unclustered
              - quarantined
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /clusters:
    get:
      operationId: clusters
      summary: Signal clusters for the theme map
      tags:
        - signals
      parameters:
        - name: series
          in: query
          required: false
          schema:
            type: string
            enum:
              - G60
              - F70
              - G70
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalCluster"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /agent-runs:
    get:
      operationId: agentRuns
      summary: Recent agent runs
      tags:
        - signals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRun"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /agent-runs/refresh:
    post:
      operationId: refresh
      summary: Run the fetch loop once for a series
      tags:
        - signals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                series:
                  type: string
                  enum:
                    - G60
                    - F70
                    - G70
              required:
                - series
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/AgentRun"
                  signals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Signal"
                  notifications:
                    type: number
                  ripples:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum:
                            - active
                            - watch
                        items:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        rows:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        summary:
                          type: string
                      required:
                        - id
                        - status
                        - items
                        - rows
                        - summary
                      additionalProperties: false
                required:
                  - run
                  - signals
                  - notifications
                  - ripples
                additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /quarantine:
    get:
      operationId: quarantine
      summary: Rejected signals with reason
      tags:
        - signals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuarantineItem"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /cases:
    get:
      operationId: cases
      summary: List cases
      tags:
        - cases
      parameters:
        - name: series
          in: query
          required: false
          schema:
            type: string
            enum:
              - G60
              - F70
              - G70
        - name: ownerId
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - observed
              - new
              - investigating
              - awaiting_answers
              - ready
              - decided
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - global
              - RoW
              - CN
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
    post:
      operationId: createCase
      summary: Start a case from signals, or empty to fill by hand
      tags:
        - cases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 3
                series:
                  type: string
                  enum:
                    - G60
                    - F70
                    - G70
                scope:
                  type: string
                  enum:
                    - global
                    - RoW
                    - CN
                type:
                  type: string
                  enum:
                    - new_feature
                    - fix_improve
                    - performance_target
                    - quality_perception
                    - market_variant
                    - brand_differentiator
                    - regression
                changeDepth:
                  type: string
                  enum:
                    - trim_option
                    - part_module
                    - platform_powertrain
                    - software_ota
                summary:
                  type: string
                signalIds:
                  type: array
                  items:
                    type: string
                topicId:
                  type: string
                aspectGroup:
                  type: string
                  enum:
                    - function
                    - usability
                    - reliability
