                rationale:
                  type: string
                  minLength: 1
              required:
                - factor
                - rationale
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleConversion"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /settings/monitor:
    get:
      operationId: monitorSettings
      summary: Monitor settings (mute threshold, at-par tolerance)
      tags:
        - monitor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorSettings"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
    put:
      operationId: saveMonitorSettings
      summary: Change monitor settings (logged with a reason)
      tags:
        - monitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                muteThresholdPct:
                  type: number
                  minimum: 0
                  maximum: 50
                atParTolerancePct:
                  type: number
                  minimum: 0
                  maximum: 20
                rationale:
                  type: string
                  minLength: 1
              required:
                - rationale
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorSettings"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
