openapi: 3.1.0
info:
  title: Requirement Studio API
  version: 0.1.0
  description: "Contract between the UI and the backend. Source of truth: web/src/contracts (Zod). Regenerate with `npm run export-contract` in web/. Reference implementation (mock): web/src/mock."
servers:
  - url: /api
    description: Mock backend (Next.js route handlers)
security:
  - userHeader: []
paths:
  /me:
    get:
      operationId: me
      summary: Current user, workspace and active weight profile
      tags:
        - identity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  workspace:
                    $ref: "#/components/schemas/Workspace"
                  weightProfile:
                    $ref: "#/components/schemas/WeightProfile"
                required:
                  - user
                  - workspace
                  - weightProfile
                additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /users:
    get:
      operationId: users
      summary: All users
      tags:
        - identity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /workspace:
    put:
      operationId: updateWorkspace
      summary: Update my workspace (weights, filters, watchlist, project type)
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                series:
                  type: string
                  enum:
                    - G60
                    - F70
                    - G70
                region:
                  type: string
                  enum:
                    - global
                    - RoW
                    - CN
                projectType:
                  type: string
                  enum:
                    - new_gen
                    - lci
                weightProfileId:
                  type: string
                  minLength: 1
                sourceFilter:
                  $ref: "#/components/schemas/SourceFilter"
                watchlist:
                  $ref: "#/components/schemas/Watchlist"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /search:
    get:
      operationId: search
      summary: Global search
      tags:
        - identity
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - case
                        - requirement
                        - signal
                        - user
                    id:
                      type: string
                    title:
                      type: string
                    subtitle:
                      type: string
                    href:
                      type: string
                  required:
                    - type
                    - id
                    - title
                    - subtitle
                    - href
                  additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /signals:
    get:
      operationId: signals
      summary: List signals (findings)
      tags:
        - signals
      parameters:
        - name: series
          in: query
          required: false
          schema:
            type: string
            enum:
              - G60
              - F70
              - G70
        - name: caseId
          in: query
          required: false
          schema:
            type: string
        - name: agent
          in: query
          required: false
          schema:
            type: string
            enum:
              - bmw_data
              - competitor
              - customer_public
              - trends
              - innovation_scout
        - name: market
          in: query
          required: false
          schema:
            type: string
            enum:
              - EU
              - US
              - CN
              - RoW
              - unknown
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - complaint
              - wish
              - like
              - competitor_fact
              - trend
              - innovation
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - new
              - clustered
              - unclustered
              - quarantined
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /clusters:
    get:
      operationId: clusters
      summary: Signal clusters for the theme map
      tags:
        - signals
      parameters:
        - name: series
          in: query
          required: false
          schema:
            type: string
            enum:
              - G60
              - F70
              - G70
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalCluster"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /agent-runs:
    get:
      operationId: agentRuns
      summary: Recent agent runs
      tags:
        - signals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRun"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /agent-runs/refresh:
    post:
      operationId: refresh
      summary: Run the fetch loop once for a series
      tags:
        - signals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                series:
                  type: string
                  enum:
                    - G60
                    - F70
                    - G70
              required:
                - series
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/AgentRun"
                  signals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Signal"
                  notifications:
                    type: number
                required:
                  - run
                  - signals
                  - notifications
                additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /quarantine:
    get:
      operationId: quarantine
      summary: Rejected signals with reason
      tags:
        - signals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuarantineItem"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /cases:
    get:
      operationId: cases
      summary: List cases
      tags:
        - cases
      parameters:
        - name: series
          in: query
          required: false
          schema:
            type: string
            enum:
              - G60
              - F70
              - G70
        - name: ownerId
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - observed
              - new
              - investigating
              - awaiting_answers
              - ready
              - decided
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - global
              - RoW
              - CN
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
    post:
      operationId: createCase
      summary: Start a case from signals
      tags:
        - cases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 3
                series:
                  type: string
                  enum:
                    - G60
                    - F70
                    - G70
                scope:
                  type: string
                  enum:
                    - global
                    - RoW
                    - CN
                carArea:
                  type: string
                  enum:
                    - exterior_design
                    - interior_comfort
                    - seats
                    - climate
                    - infotainment_hmi
                    - connectivity_digital
                    - driver_assistance
                    - dynamics_powertrain
                    - range_charging
                    - practicality
                    - quality_materials
                type:
                  type: string
                  enum:
                    - new_feature
                    - fix_improve
                    - performance_target
                    - quality_perception
                    - market_variant
                    - brand_differentiator
                    - regression
                changeDepth:
                  type: string
                  enum:
                    - trim_option
                    - part_module
                    - platform_powertrain
                    - software_ota
                summary:
                  type: string
                signalIds:
                  minItems: 1
                  type: array
                  items:
                    type: string
                rationale:
                  type: string
                  minLength: 1
              required:
                - title
                - series
                - scope
                - carArea
                - type
                - changeDepth
                - summary
                - signalIds
                - rationale
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /cases/{id}:
    get:
      operationId: caseBundle
      summary: Case with signals, questions, requirements, referrals
      tags:
        - cases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  case:
                    $ref: "#/components/schemas/Case"
                  signals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Signal"
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpenQuestion"
                  requirements:
                    type: array
                    items:
                      $ref: "#/components/schemas/Requirement"
                  referrals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Referral"
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  meetingNotes:
                    type: array
                    items:
                      $ref: "#/components/schemas/MeetingNote"
                  proposals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proposal"
                  linkedCases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Case"
                required:
                  - case
                  - signals
                  - questions
                  - requirements
                  - referrals
                  - alerts
                  - meetingNotes
                  - proposals
                  - linkedCases
                additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
    patch:
      operationId: patchCase
      summary: Edit case fields or body
      tags:
        - cases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patch:
                  type: object
                  properties:
                    title:
                      type: string
                    summary:
                      type: string
                    bodyMd:
                      type: string
                    scope:
                      type: string
                      enum:
                        - global
                        - RoW
                        - CN
                    markets:
                      type: array
                      items:
                        type: string
                        enum:
                          - EU
                          - US
                          - CN
                          - RoW
                          - unknown
                    carArea:
                      type: string
                      enum:
                        - exterior_design
                        - interior_comfort
                        - seats
                        - climate
                        - infotainment_hmi
                        - connectivity_digital
                        - driver_assistance
                        - dynamics_powertrain
                        - range_charging
                        - practicality
                        - quality_materials
                    type:
                      type: string
                      enum:
                        - new_feature
                        - fix_improve
                        - performance_target
                        - quality_perception
                        - market_variant
                        - brand_differentiator
                        - regression
                    changeDepth:
                      type: string
                      enum:
                        - trim_option
                        - part_module
                        - platform_powertrain
                        - software_ota
                    featureName:
                      type: string
                    coOwnerIds:
                      type: array
                      items:
                        type: string
                        minLength: 1
                    watcherIds:
                      type: array
                      items:
                        type: string
                        minLength: 1
                    manualRank:
                      anyOf:
                        - type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        - type: "null"
                    manualRankReason:
                      type: string
                    brandFit:
                      type: object
                      properties:
                        value:
                          type: number
                          minimum: 0
                          maximum: 1
                        reason:
                          type: string
                        confirmedBy:
                          anyOf:
                            - type: string
                              minLength: 1
                            - type: "null"
                      required:
                        - value
                        - reason
                        - confirmedBy
                rationale:
                  type: string
              required:
                - patch
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /cases/{id}/transition:
    post:
      operationId: transitionCase
      summary: Move a case (state or outcome)
      tags:
        - cases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                    - open
                    - start
                    - await
                    - ready
                    - reopen
                    - confirm
                    - refer
                    - innovation
                    - park
                    - merge
                    - reject
                rationale:
                  type: string
                  minLength: 1
                toUserId:
                  type: string
                mergeIntoId:
                  type: string
                horizon:
                  type: string
                  enum:
                    - next_gen
                    - gen_after
                    - new_product
                escalate:
                  type: boolean
              required:
                - action
                - rationale
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /cases/{id}/questions:
    post:
      operationId: createQuestion
      summary: Add an open question
      tags:
        - cases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addressee:
                  type: string
                  enum:
                    - engineering
                    - finance
                    - design
                    - quality
                    - market_pm
                    - purchasing
                    - other
                contact:
                  type: string
                question:
                  type: string
                  minLength: 3
                why:
                  type: string
                dueDate:
                  type: string
                fieldsAffected:
                  type: array
                  items:
                    type: string
              required:
                - addressee
                - question
                - why
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenQuestion"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /cases/{id}/meeting-notes:
    post:
      operationId: addMeetingNote
      summary: Paste meeting notes; AI proposes answers and field updates
      tags:
        - cases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                date:
                  type: string
                attendees:
                  type: array
                  items:
                    type: string
                text:
                  type: string
                  minLength: 10
              required:
                - title
                - date
                - attendees
                - text
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: "#/components/schemas/MeetingNote"
                  proposals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proposal"
                required:
                  - note
                  - proposals
                additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /cases/{id}/requirements/generate:
    post:
      operationId: generateRequirements
      summary: Draft requirement(s) from a confirmed case
      tags:
        - cases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requirement"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /cases/{id}/export.md:
    get:
      operationId: exportCaseMd
      summary: Case as markdown with YAML front matter
      tags:
        - cases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename:
                    type: string
                  content:
                    type: string
                required:
                  - filename
                  - content
                additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /questions:
    get:
      operationId: questions
      summary: Open questions (mine by default)
      tags:
        - questions
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenQuestion"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /questions/{id}:
    patch:
      operationId: patchQuestion
      summary: Edit or answer a question
      tags:
        - questions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addressee:
                  type: string
                  enum:
                    - engineering
                    - finance
                    - design
                    - quality
                    - market_pm
                    - purchasing
                    - other
                contact:
                  type: string
                question:
                  type: string
                why:
                  type: string
                status:
                  type: string
                  enum:
                    - open
                    - answered
                    - dropped
                answer:
                  type: string
                dueDate:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenQuestion"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /requirements:
    get:
      operationId: requirements
      summary: List requirements
      tags:
        - requirements
      parameters:
        - name: series
          in: query
          required: false
          schema:
            type: string
            enum:
              - G60
              - F70
              - G70
        - name: caseId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requirement"
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
  /requirements/{id}:
    get:
      operationId: requirementBundle
      summary: Requirement with its case and evidence
      tags:
        - requirements
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requirement:
                    $ref: "#/components/schemas/Requirement"
                  case:
                    $ref: "#/components/schemas/Case"
                  signals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Signal"
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpenQuestion"
                  variants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Requirement"
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  proposals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proposal"
                  plannedFeature:
                    anyOf:
                      - $ref: "#/components/schemas/PlannedFeature"
                      - type: "null"
                required:
                  - requirement
                  - case
                  - signals
                  - questions
                  - variants
                  - alerts
                  - proposals
                  - plannedFeature
                additionalProperties: false
        "400":
          description: Invalid request (Zod issues)
        "403":
          description: Not allowed for this user (e.g. not the owner)
        "404":
          description: Not found
        "409":
          description: Invalid state transition
    patch:
      operationId: patchRequirement
      summary: Edit a requirement
      tags:
        - requirements
      parameters:
        - name: id
